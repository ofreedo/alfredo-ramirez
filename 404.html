<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · A.R. Consulting</title>
<meta name="robots" content="noindex">
<script>
  // The site shows section addresses like arconsultingwebsites.com/services. Those sections live on
  // the homepage, so a typed address jumps there instead of dead-ending. (/hospitality is a real page.)
  (function () {
    var map = { services: 'services', work: 'work', about: 'about', faq: 'faq', contact: 'contact', process: 'faq' };
    var key = location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
    if (map[key]) location.replace('/#' + map[key]);
  })();
</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css?v=4">
</head>
<body>
<header class="top wrap">
  <a class="brand" href="/"><span class="mono">A.R.</span><span class="brand-name">A.R. Consulting</span></a>
  <nav class="nav" aria-label="Main">
    <a href="/#services">Services</a><a href="/#work">Work</a><a href="/hospitality/">Hospitality</a><a href="/#faq">FAQ</a>
    <a class="btn-sm" href="/#contact">Contact</a>
  </nav>
</header>
<main class="wrap nf">
  <div class="sec-top"><span class="path"><span class="dom">arconsultingwebsites.com</span><b>/</b><span id="nf-path"></span></span></div>
  <h1 class="h2">There's no page at this address.</h1>
  <p class="sub">Try the <a href="/">homepage</a>, <a href="/#work">recent work</a>, or <a href="/hospitality/">booking systems for lodging</a>.</p>
</main>
<script>document.getElementById('nf-path').textContent = decodeURIComponent(location.pathname.replace(/^\//, '')).slice(0, 60);</script>
</body>
</html>
