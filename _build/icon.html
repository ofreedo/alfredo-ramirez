<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon template</title>
<!-- Source for favicon.ico (?round) and apple-touch-icon.png (square). Re-render: bash _build/icons.sh -->
<link rel="stylesheet" href="../css/style.css?v=5">
<style>
  html,body{margin:0;background:transparent}
  .ic{width:512px;height:512px;display:grid;place-items:center;background:var(--ink);color:var(--paper);font:800 150px/1 var(--serif);letter-spacing:.01em}
  .ic.round{border-radius:50%}
</style>
</head>
<body>
<div class="ic" id="ic">A.R.</div>
<script>if (location.search.indexOf('round') > -1) document.getElementById('ic').classList.add('round');</script>
</body>
</html>
